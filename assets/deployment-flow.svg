<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-labelledby="title desc"><title id="title">Illustrative deployment flow</title><desc id="desc">Git change, validation, preflight, deployment, revision check and report. Animated dots illustrate flow, not live status.</desc><style>@media(prefers-reduced-motion:reduce){.moving{display:none}}</style><rect width="1000" height="230" rx="16" fill="#101c2d"/><g font-family="system-ui,sans-serif"><text x="28" y="36" fill="#f1f5f9" font-size="21" font-weight="700">A change, from commit to outcome</text><text x="28" y="59" fill="#a9b9cf" font-size="13">Illustrative path for an eligible change · not live telemetry</text></g><g fill="none" stroke="#64748b" stroke-width="2"><path d="M158 125H195 M320 125H357 M482 125H519 M644 125H681 M806 125H843"/></g><g><rect x="33" y="94" width="125" height="62" rx="9" fill="#1e293b" stroke="#38bdf8"/><text x="95.5" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#f8fafc">Plan change</text><circle cx="95.5" cy="177" r="3" fill="#38bdf8"/></g><g><rect x="195" y="94" width="125" height="62" rx="9" fill="#1e293b" stroke="#a78bfa"/><text x="257.5" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#f8fafc">Validate</text><circle cx="257.5" cy="177" r="3" fill="#a78bfa"/></g><g><rect x="357" y="94" width="125" height="62" rx="9" fill="#1e293b" stroke="#a78bfa"/><text x="419.5" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#f8fafc">Preflight</text><circle cx="419.5" cy="177" r="3" fill="#a78bfa"/></g><g><rect x="519" y="94" width="125" height="62" rx="9" fill="#1e293b" stroke="#2dd4bf"/><text x="581.5" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#f8fafc">Deploy</text><circle cx="581.5" cy="177" r="3" fill="#2dd4bf"/></g><g><rect x="681" y="94" width="125" height="62" rx="9" fill="#1e293b" stroke="#2dd4bf"/><text x="743.5" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#f8fafc">Revision check</text><circle cx="743.5" cy="177" r="3" fill="#2dd4bf"/></g><g><rect x="843" y="94" width="125" height="62" rx="9" fill="#1e293b" stroke="#fbbf24"/><text x="905.5" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#f8fafc">Report</text><circle cx="905.5" cy="177" r="3" fill="#fbbf24"/></g><g class="moving" fill="#7dd3fc"><circle r="4" cy="125" cx="158"><animate attributeName="cx" values="158;195;195" dur="2.8s" begin="0s" repeatCount="2"/></circle><circle r="4" cy="125" cx="320"><animate attributeName="cx" values="320;357;357" dur="2.8s" begin="0.35s" repeatCount="2"/></circle><circle r="4" cy="125" cx="482"><animate attributeName="cx" values="482;519;519" dur="2.8s" begin="0.7s" repeatCount="2"/></circle><circle r="4" cy="125" cx="644"><animate attributeName="cx" values="644;681;681" dur="2.8s" begin="1.0499999999999998s" repeatCount="2"/></circle><circle r="4" cy="125" cx="806"><animate attributeName="cx" values="806;843;843" dur="2.8s" begin="1.4s" repeatCount="2"/></circle></g><text x="28" y="211" font-family="system-ui,sans-serif" font-size="12" fill="#a9b9cf">Revision verification is not an application health check.</text><g class="moving" fill="#38bdf8"><rect x="33" y="188" width="12" height="4" rx="2"><animate attributeName="width" values="12;935" dur="6s" repeatCount="2"/></rect></g></svg>