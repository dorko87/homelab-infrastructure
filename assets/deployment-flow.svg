<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Illustrative deployment flow</title><desc id="desc">After merge: plan eligible changes, validate Compose, preflight, deploy, verify revision, report. Finite animation illustrates the successful path, not live activity.</desc><rect width="800" height="420" rx="18" fill="#0b1526"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker></defs><style>@media(prefers-reduced-motion:reduce){.moving{display:none}}</style><g font-family="system-ui,Segoe UI,sans-serif"><text x="24" y="38" font-size="27" fill="#f8fafc" font-weight="700" text-anchor="start">From merge to outcome</text><text x="24" y="65" font-size="16" fill="#94a3b8" font-weight="400" text-anchor="start">Eligible-change path · illustrative, not live telemetry</text><g fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"><path d="M240 140H276"/><path d="M500 140H536"/><path d="M650 188V231"/><path d="M540 281H504"/><path d="M280 281H244"/></g><rect x="20" y="94" width="220" height="94" rx="12" fill="#152238" stroke="#38bdf8"/><text x="35" y="116" font-size="13" fill="#38bdf8" font-weight="700" text-anchor="start">01</text><text x="130" y="142" font-size="20" fill="#38bdf8" font-weight="700" text-anchor="middle">Plan</text><text x="130" y="166" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">Changed, eligible stacks</text><rect x="280" y="94" width="220" height="94" rx="12" fill="#152238" stroke="#a78bfa"/><text x="295" y="116" font-size="13" fill="#a78bfa" font-weight="700" text-anchor="start">02</text><text x="390" y="142" font-size="20" fill="#a78bfa" font-weight="700" text-anchor="middle">Validate</text><text x="390" y="166" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">Docker Compose</text><rect x="540" y="94" width="220" height="94" rx="12" fill="#152238" stroke="#a78bfa"/><text x="555" y="116" font-size="13" fill="#a78bfa" font-weight="700" text-anchor="start">03</text><text x="650" y="142" font-size="20" fill="#a78bfa" font-weight="700" text-anchor="middle">Preflight</text><text x="650" y="166" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">Dockhand checks</text><rect x="540" y="235" width="220" height="94" rx="12" fill="#152238" stroke="#2dd4bf"/><text x="555" y="257" font-size="13" fill="#2dd4bf" font-weight="700" text-anchor="start">04</text><text x="650" y="283" font-size="20" fill="#2dd4bf" font-weight="700" text-anchor="middle">Deploy</text><text x="650" y="307" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">Selected stacks</text><rect x="280" y="235" width="220" height="94" rx="12" fill="#152238" stroke="#2dd4bf"/><text x="295" y="257" font-size="13" fill="#2dd4bf" font-weight="700" text-anchor="start">05</text><text x="390" y="283" font-size="20" fill="#2dd4bf" font-weight="700" text-anchor="middle">Verify revision</text><text x="390" y="307" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">Match merge revision</text><rect x="20" y="235" width="220" height="94" rx="12" fill="#152238" stroke="#fbbf24"/><text x="35" y="257" font-size="13" fill="#fbbf24" font-weight="700" text-anchor="start">06</text><text x="130" y="283" font-size="20" fill="#fbbf24" font-weight="700" text-anchor="middle">Report</text><text x="130" y="307" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">Outcome summary</text><g class="moving" fill="none" stroke-width="3"><rect x="22" y="96" width="216" height="90" rx="10" stroke="#38bdf8" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0250;0.1300;0.1667;1" dur="9s" repeatCount="2"/></rect><rect x="282" y="96" width="216" height="90" rx="10" stroke="#a78bfa" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1667;0.1917;0.2967;0.3333;1" dur="9s" repeatCount="2"/></rect><rect x="542" y="96" width="216" height="90" rx="10" stroke="#a78bfa" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.3583;0.4633;0.5000;1" dur="9s" repeatCount="2"/></rect><rect x="542" y="237" width="216" height="90" rx="10" stroke="#2dd4bf" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5250;0.6300;0.6667;1" dur="9s" repeatCount="2"/></rect><rect x="282" y="237" width="216" height="90" rx="10" stroke="#2dd4bf" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.6917;0.7967;0.8333;1" dur="9s" repeatCount="2"/></rect><rect x="22" y="237" width="216" height="90" rx="10" stroke="#fbbf24" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8333;0.8583;0.9633;1.0000;1" dur="9s" repeatCount="2"/></rect><rect x="20" y="350" width="740" height="6" rx="3" stroke="none" fill="#26374c"/><rect x="20" y="350" width="0" height="6" rx="3" fill="#38bdf8" stroke="none"><animate attributeName="width" from="0" to="740" dur="9s" repeatCount="2" fill="freeze"/></rect></g><text x="20" y="387" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start">Revision verification does not establish application health.</text></g></svg>