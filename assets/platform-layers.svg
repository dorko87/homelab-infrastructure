<svg xmlns="http://www.w3.org/2000/svg" width="800" height="525" viewBox="0 0 800 525" role="img" aria-labelledby="title desc"><title id="title">Platform layers</title><desc id="desc">Logical flow from versioned configuration through validation, orchestration and runtime to operational concerns.</desc><rect width="800" height="525" rx="18" fill="#0b1526"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker></defs><g font-family="system-ui,Segoe UI,sans-serif"><text x="26" y="41" font-size="27" fill="#f8fafc" font-weight="700" text-anchor="start">Platform layers</text><text x="26" y="66" font-size="15" fill="#94a3b8" font-weight="400" text-anchor="start">Logical responsibilities, not physical topology</text><rect x="26" y="84" width="748" height="62" rx="10" fill="#152238" stroke="#38bdf8"/><text x="44" y="122" font-size="18" fill="#38bdf8" font-weight="700" text-anchor="start">01</text><text x="88" y="111" font-size="20" fill="#f8fafc" font-weight="600" text-anchor="start">Source of truth</text><text x="88" y="132" font-size="15" fill="#cbd5e1" font-weight="400" text-anchor="start">Git · Forgejo</text><path d="M400 146v22" stroke="#94a3b8" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="26" y="172" width="748" height="62" rx="10" fill="#152238" stroke="#a78bfa"/><text x="44" y="210" font-size="18" fill="#a78bfa" font-weight="700" text-anchor="start">02</text><text x="88" y="199" font-size="20" fill="#f8fafc" font-weight="600" text-anchor="start">Validation &amp; policy</text><text x="88" y="220" font-size="15" fill="#cbd5e1" font-weight="400" text-anchor="start">CI checks · deployment planner</text><path d="M400 234v22" stroke="#94a3b8" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="26" y="260" width="748" height="62" rx="10" fill="#152238" stroke="#a78bfa"/><text x="44" y="298" font-size="18" fill="#a78bfa" font-weight="700" text-anchor="start">03</text><text x="88" y="287" font-size="20" fill="#f8fafc" font-weight="600" text-anchor="start">Orchestration</text><text x="88" y="308" font-size="15" fill="#cbd5e1" font-weight="400" text-anchor="start">Dockhand · centralized secrets</text><path d="M400 322v22" stroke="#94a3b8" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="26" y="348" width="748" height="62" rx="10" fill="#152238" stroke="#2dd4bf"/><text x="44" y="386" font-size="18" fill="#2dd4bf" font-weight="700" text-anchor="start">04</text><text x="88" y="375" font-size="20" fill="#f8fafc" font-weight="600" text-anchor="start">Runtime</text><text x="88" y="396" font-size="15" fill="#cbd5e1" font-weight="400" text-anchor="start">Multi-host Docker · selected workloads</text><path d="M400 410v22" stroke="#94a3b8" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="26" y="436" width="748" height="62" rx="10" fill="#152238" stroke="#fbbf24"/><text x="44" y="474" font-size="18" fill="#fbbf24" font-weight="700" text-anchor="start">05</text><text x="88" y="463" font-size="20" fill="#f8fafc" font-weight="600" text-anchor="start">Operational concerns</text><text x="88" y="484" font-size="15" fill="#cbd5e1" font-weight="400" text-anchor="start">Observability · backup · recovery</text></g></svg>