<svg xmlns="http://www.w3.org/2000/svg" width="800" height="458" viewBox="0 0 800 458" role="img" aria-labelledby="title desc"><title id="title">Platform layers</title><desc id="desc">Git, validation, orchestration and runtime form the delivery path. Observability and recovery support the environment across layers.</desc><rect width="800" height="458" rx="18" fill="#0b1526"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker></defs><g font-family="system-ui,Segoe UI,sans-serif"><text x="24" y="41" font-size="27" fill="#f8fafc" font-weight="700">Platform layers</text><text x="24" y="65" font-size="15" fill="#94a3b8">Logical responsibilities, not physical topology</text><rect x="24" y="85" width="495" height="64" rx="10" fill="#152238" stroke="#38bdf8"/><text x="43" y="122" font-size="18" fill="#38bdf8" font-weight="700">01</text><text x="85" y="112" font-size="19" fill="#f8fafc" font-weight="600">Source of truth</text><text x="85" y="133" font-size="14" fill="#cbd5e1">Git · Forgejo</text><path d="M272 149v20" stroke="#94a3b8" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="24" y="173" width="495" height="64" rx="10" fill="#152238" stroke="#a78bfa"/><text x="43" y="210" font-size="18" fill="#a78bfa" font-weight="700">02</text><text x="85" y="200" font-size="19" fill="#f8fafc" font-weight="600">Validation &amp; policy</text><text x="85" y="221" font-size="14" fill="#cbd5e1">CI checks · deployment planner</text><path d="M272 237v20" stroke="#94a3b8" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="24" y="261" width="495" height="64" rx="10" fill="#152238" stroke="#a78bfa"/><text x="43" y="298" font-size="18" fill="#a78bfa" font-weight="700">03</text><text x="85" y="288" font-size="19" fill="#f8fafc" font-weight="600">Orchestration</text><text x="85" y="309" font-size="14" fill="#cbd5e1">Dockhand · centralized secrets</text><path d="M272 325v20" stroke="#94a3b8" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="24" y="349" width="495" height="64" rx="10" fill="#152238" stroke="#2dd4bf"/><text x="43" y="386" font-size="18" fill="#2dd4bf" font-weight="700">04</text><text x="85" y="376" font-size="19" fill="#f8fafc" font-weight="600">Runtime</text><text x="85" y="397" font-size="14" fill="#cbd5e1">Multi-host Docker · selected workloads</text><path d="M529 95h12v308h-12M541 249h17" stroke="#fbbf24" stroke-opacity=".8" stroke-width="2" stroke-dasharray="5 4" fill="none"/><rect x="558" y="85" width="218" height="328" rx="12" fill="#142238" stroke="#fbbf24" stroke-opacity=".8"/><text x="573" y="113" font-size="15" font-weight="700" fill="#fbbf24">CROSS-CUTTING</text><text x="573" y="133" font-size="15" font-weight="700" fill="#fbbf24">OPERATIONS</text><rect x="573" y="157" width="188" height="98" rx="9" fill="#0b1526" stroke="#2dd4bf"/><text x="587" y="185" fill="#2dd4bf" font-size="16" font-weight="600">Observability</text><text x="587" y="210" fill="#cbd5e1" font-size="13">Metrics, health</text><text x="587" y="229" fill="#cbd5e1" font-size="13">and availability</text><rect x="573" y="270" width="188" height="112" rx="9" fill="#0b1526" stroke="#fbbf24"/><text x="587" y="298" fill="#fbbf24" font-size="16" font-weight="600">Recovery</text><text x="587" y="322" fill="#cbd5e1" font-size="13">Backups, selective</text><text x="587" y="341" fill="#cbd5e1" font-size="13">offsite coverage,</text><text x="587" y="360" fill="#cbd5e1" font-size="13">restore verification</text><text x="24" y="440" fill="#94a3b8" font-size="13">Dashed bracket = supporting capabilities, not deployment steps.</text></g></svg>
