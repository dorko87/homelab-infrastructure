<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">Recovery design</title><desc id="desc">Workload data including database-native dumps feeds backup preparation, followed by local and selective offsite copies. Each tier is subject to separate restore verification.</desc><rect width="800" height="520" rx="18" fill="#0b1526"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker></defs><g font-family="system-ui,Segoe UI,sans-serif"><text x="25" y="40" font-size="26" fill="#f8fafc" font-weight="700">A backup is not a proven restore.</text><text x="25" y="66" font-size="15" fill="#94a3b8">Recovery model · verification remains separate</text><g fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"><path d="M260 140H307"/><path d="M400 185V210H205V237"/><path d="M400 185V210H595V237"/></g><g fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"><path d="M205 325V352H320V377"/><path d="M595 325V352H480V377"/></g><rect x="25" y="95" width="235" height="90" rx="12" fill="#152238" stroke="#38bdf8"/><text x="142.5" y="129" text-anchor="middle" font-size="18" font-weight="700" fill="#38bdf8">Workload data</text><text x="142.5" y="154" text-anchor="middle" font-size="14" fill="#cbd5e1">Includes native DB dumps</text><rect x="310" y="95" width="180" height="90" rx="12" fill="#152238" stroke="#a78bfa"/><text x="400" y="129" text-anchor="middle" font-size="18" font-weight="700" fill="#a78bfa">Prepare backups</text><text x="400" y="154" text-anchor="middle" font-size="14" fill="#cbd5e1">Restic / Borg</text><rect x="65" y="240" width="280" height="85" rx="12" fill="#152238" stroke="#fbbf24"/><text x="205" y="274" text-anchor="middle" font-size="18" font-weight="700" fill="#fbbf24">Local backup</text><text x="205" y="299" text-anchor="middle" font-size="14" fill="#cbd5e1">Selected data</text><rect x="455" y="240" width="280" height="85" rx="12" fill="#152238" stroke="#fbbf24"/><text x="595" y="274" text-anchor="middle" font-size="18" font-weight="700" fill="#fbbf24">Offsite tier</text><text x="595" y="299" text-anchor="middle" font-size="14" fill="#cbd5e1">Selective coverage</text><rect x="240" y="380" width="320" height="85" rx="12" fill="#152238" stroke="#2dd4bf"/><text x="400" y="414" text-anchor="middle" font-size="18" font-weight="700" fill="#2dd4bf">Restore verification</text><text x="400" y="439" text-anchor="middle" font-size="14" fill="#cbd5e1">Confidence, not a guarantee</text><text x="25" y="494" font-size="13" fill="#94a3b8">Dashed paths represent verification activities, not completed tests.</text></g></svg>
