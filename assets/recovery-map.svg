<svg xmlns="http://www.w3.org/2000/svg" width="800" height="426" viewBox="0 0 800 426" role="img" aria-labelledby="title desc"><title id="title">Recovery design</title><desc id="desc">Workload data and native database dumps are prepared for local backup and selective offsite coverage; both backup tiers inform separate restore verification.</desc><rect width="800" height="426" rx="18" fill="#0b1526"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker></defs><g font-family="system-ui,Segoe UI,sans-serif"><text x="24" y="40" font-size="26" fill="#f8fafc" font-weight="700" text-anchor="start">A backup is not a proven restore.</text><text x="24" y="66" font-size="15" fill="#94a3b8" font-weight="400" text-anchor="start">Recovery model · verification remains separate</text><g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M245 140H287"/><path d="M510 140H552"/><path d="M665 186V217"/></g><g stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow)"><path d="M575 186V204H444V330H423"/><path d="M555 266H469V352H423"/></g><rect x="25" y="94" width="220" height="92" rx="12" fill="#152238" stroke="#38bdf8"/><text x="135" y="134" font-size="19" fill="#38bdf8" font-weight="700" text-anchor="middle">Workload data</text><text x="135" y="159" font-size="15" fill="#cbd5e1" font-weight="400" text-anchor="middle">Native DB dumps</text><rect x="290" y="94" width="220" height="92" rx="12" fill="#152238" stroke="#a78bfa"/><text x="400" y="134" font-size="19" fill="#a78bfa" font-weight="700" text-anchor="middle">Backup preparation</text><text x="400" y="159" font-size="15" fill="#cbd5e1" font-weight="400" text-anchor="middle">Restic / Borg</text><rect x="555" y="94" width="220" height="92" rx="12" fill="#152238" stroke="#fbbf24"/><text x="665" y="134" font-size="19" fill="#fbbf24" font-weight="700" text-anchor="middle">Local backup</text><text x="665" y="159" font-size="15" fill="#cbd5e1" font-weight="400" text-anchor="middle">Selected data</text><rect x="555" y="220" width="220" height="92" rx="12" fill="#152238" stroke="#fbbf24"/><text x="665" y="260" font-size="19" fill="#fbbf24" font-weight="700" text-anchor="middle">Offsite tier</text><text x="665" y="285" font-size="15" fill="#cbd5e1" font-weight="400" text-anchor="middle">Selective coverage</text><rect x="25" y="303" width="395" height="80" rx="12" fill="#153b47" stroke="#2dd4bf"/><text x="222.5" y="334" font-size="20" fill="#99f6e4" font-weight="700" text-anchor="middle">Restore verification</text><text x="222.5" y="358" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="middle">Confidence, not a guarantee</text><text x="25" y="411" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">Dashed paths represent verification activities, not completed tests.</text></g></svg>