<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="t d"><title id="t">Recovery design</title><desc id="d">Backup preparation, local and selective offsite copies, and restore verification as an ongoing requirement.</desc><rect width="1000" height="310" rx="18" fill="#0b1526"/><g font-family="system-ui,sans-serif"><text x="30" y="42" fill="#f8fafc" font-size="26" font-weight="700">A backup is not a proven restore.</text><text x="30" y="69" fill="#94a3b8" font-size="15">Recovery model / verification remains a separate activity</text><g fill="none" stroke="#64748b" stroke-width="2"><path d="M200 150H250 M430 150H480 M660 150H710"/><path d="M570 190V245H800V190" stroke-dasharray="6 5"/></g><rect x="20" y="110" width="180" height="80" rx="12" fill="#152238" stroke="#38bdf8"/><text x="110" y="140" text-anchor="middle" font-size="17" fill="#38bdf8" font-weight="600">Workload data</text><text x="110" y="164" text-anchor="middle" font-size="13" fill="#cbd5e1">Native DB dumps</text><rect x="250" y="110" width="180" height="80" rx="12" fill="#152238" stroke="#a78bfa"/><text x="340" y="140" text-anchor="middle" font-size="17" fill="#a78bfa" font-weight="600">Backup preparation</text><text x="340" y="164" text-anchor="middle" font-size="13" fill="#cbd5e1">Restic / Borg</text><rect x="480" y="110" width="180" height="80" rx="12" fill="#152238" stroke="#fbbf24"/><text x="570" y="140" text-anchor="middle" font-size="17" fill="#fbbf24" font-weight="600">Local backup tier</text><text x="570" y="164" text-anchor="middle" font-size="13" fill="#cbd5e1">Selected data</text><rect x="710" y="110" width="180" height="80" rx="12" fill="#152238" stroke="#fbbf24"/><text x="800" y="140" text-anchor="middle" font-size="17" fill="#fbbf24" font-weight="600">Offsite tier</text><text x="800" y="164" text-anchor="middle" font-size="13" fill="#cbd5e1">Selective coverage</text><rect x="480" y="226" width="420" height="54" rx="10" fill="#153b47" stroke="#2dd4bf"/><text x="690" y="259" text-anchor="middle" font-size="17" fill="#99f6e4">Restore verification · confidence, not a guarantee</text></g></svg>